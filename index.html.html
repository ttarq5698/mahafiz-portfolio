<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محافظ | بوابة المستثمر الشخصية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-slate-900 p-5 rounded-2xl border border-slate-800">
            <div>
                <h2 class="text-xl font-bold">بوابة المستثمر الشخصية</h2>
                <p class="text-xs text-slate-400 mt-1">متابعة الأرباح والمسحوبات ببيانات متزامنة لحظياً</p>
            </div>
            <select id="userSelect" onchange="changeUser(this.value)" class="bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-xs font-bold text-amber-400">
                <option value="يونس">يونس</option>
                <option value="علي (المدير)">علي (المدير)</option>
                <option value="صقر">صقر</option>
                <option value="يوسف">يوسف</option>
                <option value="طارق">طارق</option>
                <option value="مازن">مازن</option>
                <option value="حسين">حسين</option>
                <option value="جابر">جابر</option>
            </select>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">رأس المال المستثمر</span>
                <div class="text-2xl font-extrabold mt-1" id="inv-capital">0 SAR</div>
            </div>
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">الأرباح الصافية المستحقة</span>
                <div class="text-2xl font-extrabold text-emerald-400 mt-1" id="inv-profits">0 SAR</div>
            </div>
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">صافي الرصيد الحالي</span>
                <div class="text-2xl font-extrabold text-amber-400 mt-1" id="inv-net">0 SAR</div>
            </div>
        </div>

        <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-emerald-400 flex items-center justify-between">
            <span><i class="fa-solid fa-circle-info ml-1"></i> يتم تحديث هذه الواجهة تلقائياً كل 3 ثوانٍ لتتطابق مع تعديلات الإدارة على أي جهاز (أيفون / أندرويد).</span>
            <span class="animate-pulse font-bold">متصل بالسحابة</span>
        </div>
    </div>

    <script>
        const BIN_URL = 'https://api.jsonbin.io/v3/b/65d505d9dc74654018b03045'; // نفس الرابط السحابي الموحد
        const API_KEY = '$2a$10$EXAMPLE_KEY_OR_PUBLIC';

        let currentUser = "يونس";
        let portfolioData = null;

        async function fetchCloudData() {
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY }, cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.record) {
                        portfolioData = data.record;
                        updateUI();
                    }
                }
            } catch (e) {
                // الاعتماد على التخزين المحلي في حال انقطاع النت
                const local = localStorage.getItem('mahafiz_cloud_data');
                if (local) {
                    portfolioData = JSON.parse(local);
                    updateUI();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchCloudData();
            setInterval(fetchCloudData, 3000); // التحديث التلقائي المستمر
        });

        function changeUser(name) {
            currentUser = name;
            if (portfolioData) updateUI();
        }

        function updateUI() {
            if (!portfolioData || !portfolioData.investors) return;
            const inv = portfolioData.investors.find(i => i.name === currentUser) || portfolioData.investors[0];
            const net = inv.amount + inv.profitAccumulated - inv.lossAccumulated - inv.withdrawnProfits;

            document.getElementById('inv-capital').innerText = inv.amount.toLocaleString() + ' SAR';
            document.getElementById('inv-profits').innerText = '+' + inv.profitAccumulated.toFixed(2) + ' SAR';
            document.getElementById('inv-net').innerText = net.toFixed(2) + ' SAR';
        }
    </script>
</body>
</html>
