<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محافظ | لوحة التحكم السحابية المباشرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col lg:flex-row antialiased">

    <aside class="w-full lg:w-72 bg-slate-900 border-l border-slate-800 p-5 flex flex-col justify-between">
        <div>
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white font-bold"><i class="fa-solid fa-wallet"></i></div>
                <div><h1 class="font-bold text-lg">محافظ</h1><p class="text-xs text-slate-400">الإدارة السحابية المباشرة</p></div>
            </div>
            <nav class="space-y-2 text-sm">
                <div class="p-3 rounded-xl bg-emerald-500/10 text-emerald-400 font-bold"><i class="fa-solid fa-border-all ml-2"></i> لوحة التحكم</div>
            </nav>
        </div>
        <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-emerald-400">
            <i class="fa-solid fa-circle-check ml-1"></i> التزامن السحابي الفوري مفعل
        </div>
    </aside>

    <main class="flex-1 p-6 space-y-6 overflow-y-auto">
        <header class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-bold">لوحة تحكم المشرف (علي)</h2>
            <div class="flex gap-2">
                <button onclick="openTransactionModal('profit')" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus ml-1"></i> إضافة ربح</button>
                <button onclick="openTransactionModal('loss')" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-minus ml-1"></i> تسجيل خسارة</button>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">رأس المال الأساسي</span>
                <div class="text-2xl font-extrabold mt-1" id="kpi-aum">100,000 ريال</div>
            </div>
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">إجمالي الأرباح الموزعة</span>
                <div class="text-2xl font-extrabold text-emerald-400 mt-1" id="kpi-profits">0 ريال</div>
            </div>
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <span class="text-xs text-slate-400">إجمالي الخسائر</span>
                <div class="text-2xl font-extrabold text-rose-400 mt-1" id="kpi-losses">0 ريال</div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="p-4 border-b border-slate-800 font-bold">حسابات المستثمرين والحصص</div>
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-950 text-xs text-slate-400 uppercase">
                    <tr>
                        <th class="p-4">المستثمر</th>
                        <th class="p-4">رأس المال</th>
                        <th class="p-4">الأرباح الصافية</th>
                        <th class="p-4">المسحوبات</th>
                        <th class="p-4">الصافي المتبقي</th>
                    </tr>
                </thead>
                <tbody id="investorsTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="txModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6">
            <h3 id="modalTitle" class="font-bold text-lg mb-4">تسجيل عملية</h3>
            <form onsubmit="handleTx(event)" class="space-y-4">
                <input type="hidden" id="txType" value="profit">
                <input type="number" id="txAmount" required placeholder="المبلغ الإجمالي" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white">
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-400 text-xs">إلغاء</button>
                    <button type="submit" class="bg-emerald-600 px-5 py-2 rounded-xl text-xs font-bold">اعتماد ومزامنة</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // رابط سحابي مجاني ومباشر لتخزين البيانات ومزامنتها بين الأيفون والأندرويد
        const BIN_URL = 'https://api.jsonbin.io/v3/b/65d505d9dc74654018b03045'; // استبدله برابطك الخاص أو استخدم الافتراضي للتجربة
        const API_KEY = '$2a$10$EXAMPLE_KEY_OR_PUBLIC'; // مفتاح الوصول إذا لزم

        let portfolioData = {
            investors: [
                { name: "يونس", amount: 32000, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "علي (المدير)", amount: 18500, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: true },
                { name: "صقر", amount: 14000, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "يوسف", amount: 12300, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "طارق", amount: 11000, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "مازن", amount: 7000, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "حسين", amount: 3700, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false },
                { name: "جابر", amount: 1500, profitAccumulated: 0, lossAccumulated: 0, withdrawnProfits: 0, isManager: false }
            ],
            totalProfits: 0,
            totalLosses: 0
        };

        async function loadFromCloud() {
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.record) {
                        portfolioData = data.record;
                    }
                }
            } catch (e) { console.log('الاعتماد على التخزين المحلي الاحتياطي'); }
            render();
        }

        async function saveToCloud() {
            // حفظ محلي أولاً للاستجابة السريعة
            localStorage.setItem('mahafiz_cloud_data', JSON.stringify(portfolioData));
            
            try {
                await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(portfolioData)
                });
            } catch (e) { console.log('خطأ في الرفع السحابي'); }
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFromCloud();
            setInterval(loadFromCloud, 3000); // تحديث دوري كل 3 ثوانٍ
        });

        function render() {
            document.getElementById('kpi-profits').innerText = portfolioData.totalProfits.toLocaleString() + ' ريال';
            document.getElementById('kpi-losses').innerText = portfolioData.totalLosses.toLocaleString() + ' ريال';

            const tbody = document.getElementById('investorsTableBody');
            tbody.innerHTML = '';
            const baseCap = portfolioData.investors.reduce((s, i) => s + i.amount, 0);

            portfolioData.investors.forEach(inv => {
                const net = inv.amount + inv.profitAccumulated - inv.lossAccumulated - inv.withdrawnProfits;
                tbody.innerHTML += `
                    <tr class="border-b border-slate-800">
                        <td class="p-4 font-bold">${inv.name}</td>
                        <td class="p-4">${inv.amount.toLocaleString()} SAR</td>
                        <td class="p-4 text-emerald-400">+${inv.profitAccumulated.toFixed(2)} SAR</td>
                        <td class="p-4 text-amber-400">-${inv.withdrawnProfits.toFixed(2)} SAR</td>
                        <td class="p-4 font-extrabold text-white">${net.toFixed(2)} SAR</td>
                    </tr>
                `;
            });
        }

        function openTransactionModal(type) {
            document.getElementById('txType').value = type;
            document.getElementById('modalTitle').innerText = type === 'profit' ? 'إضافة أرباح جديدة' : 'تسجيل خسارة';
            document.getElementById('tx2Modal').classList.remove('hidden'); // تصحيح اسم المودل للمثال
            document.getElementById('txModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('txModal').classList.add('hidden'); }

        function handleTx(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const baseCap = portfolioData.investors.reduce((s, i) => s + i.amount, 0);

            if (type === 'profit') {
                portfolioData.totalProfits += amount;
                portfolioData.investors.forEach(inv => {
                    const share = amount * (inv.amount / baseCap);
                    inv.profitAccumulated += inv.isManager ? share * 1.3 : share * 0.7; // خصم 30% للمدير كمثال
                });
            } else {
                portfolioData.totalLosses += amount;
                portfolioData.investors.forEach(inv => {
                    inv.lossAccumulated += amount * (inv.amount / baseCap);
                });
            }

            saveToCloud();
            closeModal();
            alert('تم اعتماد العملية ومزامنتها سحابياً لتظهر فوراً على الآيفون والأندرويد!');
        }
    </script>
</body>
</html>
